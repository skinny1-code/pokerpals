# fly.toml app configuration file generated for pokerpals-server on 2026-06-14T22:51:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pokerpals-server'
# NOTE: the app's machines actually run in ams — keep this aligned so volumes
# and new machines land in the same region.
primary_region = 'ams'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '4000'
  DATA_DIR = '/data'

# Durable storage for claimed usernames — without this, every deploy wipes them.
# Create once with: fly volumes create pvp_data --region iad --size 1
[mounts]
  source = 'pvp_data'
  destination = '/data'

[processes]
  app = 'node server/index.js'

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
