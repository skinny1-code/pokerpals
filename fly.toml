# fly.toml app configuration file generated for pokerpals on 2026-05-13T17:53:28Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pokerpals'
primary_region = 'dfw'

[build]

[env]
  NODE_ENV = 'production'

[processes]
  app = 'node server/index.js'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
