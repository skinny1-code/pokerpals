# fly.toml app configuration file generated for pokerpals-server on 2026-06-14T22:51:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pokerpals-server'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'
  PORT = '4000'

[processes]
  app = 'node server/index.js'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/tables'

[[vm]]
  size = 'shared-cpu-1x'
