# Fly.io config for the PokerVsPals WebSocket game server.
# Deploy: fly launch --no-deploy  (first time, creates the app)
#         fly deploy               (subsequent deploys — or trigger via GitHub Actions)
# Secrets: fly secrets set OPERATOR_PRIVATE_KEY=... (see below)

app = "pokerpals-server"
primary_region = "iad"          # Washington DC — close to Arbitrum RPC endpoints

[build]
  # Fly auto-detects Node.js from package.json — no Dockerfile needed.
  # Override the start command so it runs the WS server, not Next.js.
  [build.args]
    NODE_VERSION = "22"

[env]
  PORT = "4000"
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false    # keep alive — game state lives in memory
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/tables"            # /tables returns 200 JSON — use as health check

[processes]
  app = "node server/index.js"

[[vm]]
  size = "shared-cpu-1x"        # free tier — 256MB RAM, 1 shared vCPU
