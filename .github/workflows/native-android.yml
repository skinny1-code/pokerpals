name: Native Android React Native APK
on:
  push:
    branches: [feature/native-react-native]
    paths: ['native/**', '.github/workflows/native-android.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify Android SDK
        run: test -d "$ANDROID_HOME"
      - name: Install dependencies
        working-directory: native
        run: npm install --no-audit --no-fund
      - name: Native UI and API protocol tests
        working-directory: native
        run: npm test
      - name: Generate real Android native project
        working-directory: native
        run: npx expo prebuild --platform android --non-interactive
      - name: Compile native Android APK
        working-directory: native/android
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Upload native test APK
        uses: actions/upload-artifact@v4
        with:
          name: pokerpals-native-android-debug-apk
          path: native/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
