name: Deploy → Arbitrum Sepolia

on:
  # Manual one-click deploy from the Actions tab
  workflow_dispatch:
    inputs:
      handle_only:
        description: "Deploy only PokerHandle (skip full redeploy of all contracts)?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      run_faucet:
        description: "Send 10 000 CHIPS to deployer after deploy?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

  # Auto-deploy when contracts or deploy script change on main
  push:
    branches: [main, master]
    paths:
      - "contracts/**"
      - "scripts/deploy.js"
      - "hardhat.config.js"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: testnet          # requires manual approval in repo settings
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run contract tests (pre-flight)
        run: npm run test:contracts
        env:
          HARDHAT_NETWORK: hardhat

      - name: Deploy to Arbitrum Sepolia (full)
        if: github.event.inputs.handle_only != 'true'
        run: npm run deploy:testnet
        env:
          DEPLOYER_KEY:       ${{ secrets.DEPLOYER_KEY }}
          ARB_SEPOLIA_RPC:    ${{ secrets.ARB_SEPOLIA_RPC }}
          ARBISCAN_API_KEY:   ${{ secrets.ARBISCAN_API_KEY }}
          OPERATOR_SIGNER:    ${{ secrets.OPERATOR_SIGNER }}
          RAKE_WALLET:        ${{ secrets.RAKE_WALLET }}
          ANTIBOT_ORACLE:     ${{ secrets.ANTIBOT_ORACLE }}
          DEV_WALLET:         ${{ secrets.DEV_WALLET }}
          OPS_WALLET:         ${{ secrets.OPS_WALLET }}
          COMMUNITY_WALLET:   ${{ secrets.COMMUNITY_WALLET }}
          LIQUIDITY_WALLET:   ${{ secrets.LIQUIDITY_WALLET }}

      - name: Deploy PokerHandle only
        if: github.event.inputs.handle_only == 'true'
        run: npm run deploy:handle
        env:
          DEPLOYER_KEY:    ${{ secrets.DEPLOYER_KEY }}
          ARB_SEPOLIA_RPC: ${{ secrets.ARB_SEPOLIA_RPC }}

      - name: Re-encrypt .env and commit deployment manifest
        env:
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
        run: |
          node scripts/setupEnv.js || echo "⚠️ setupEnv.js warnings (non-fatal in CI)"
          if [ -n "$ENV_PASSPHRASE" ]; then
            openssl enc -aes-256-cbc -pbkdf2 -pass pass:"$ENV_PASSPHRASE" -in .env -out .env.enc
            git add .env.enc
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployments/arbitrumSepolia.json
          git diff --cached --quiet || git commit -m "chore: update deployment manifest + .env.enc [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Fund deployer from faucet
        if: github.event.inputs.run_faucet == 'true'
        run: npm run faucet
        env:
          DEPLOYER_KEY:    ${{ secrets.DEPLOYER_KEY }}
          ARB_SEPOLIA_RPC: ${{ secrets.ARB_SEPOLIA_RPC }}

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-arbitrumSepolia
          path: deployments/arbitrumSepolia.json
          retention-days: 90
