name: Deploy → Arbitrum Sepolia

on:
  # Manual one-click deploy from the Actions tab
  workflow_dispatch:
    inputs:
      handle_only:
        description: "Deploy only PokerHandle (skip full redeploy of all contracts)?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      escrow_only:
        description: "Redeploy only PokerEscrow (skip full redeploy of all contracts)?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      tournament_only:
        description: "Redeploy only TournamentManager (skip full redeploy of all contracts)?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
      run_faucet:
        description: "Send 10 000 SALOON to deployer after deploy?"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

  # NOTE: This workflow is intentionally manual-dispatch ONLY.
  #
  # A `push` trigger on `main` used to live here, auto-running the FULL
  # `deploy:testnet` (all 12 contracts) whenever `contracts/**`,
  # `scripts/deploy.js`, or `hardhat.config.js` changed. On push events all
  # `workflow_dispatch.inputs.*` are undefined, so the "(full)" step's guard
  # always evaluated true — meaning any routine contract merge silently
  # redeployed every contract and wiped all on-chain state (balances, stakes,
  # and every minted PokerHandle NFT), with no migration. That footgun
  # destroyed real user data (a minted handle) once already.
  #
  # Testnet deploys are now operator-initiated only: trigger from the Actions
  # tab (or via the API) and pick the narrowest input (handle_only / escrow_only
  # / tournament_only) unless a full redeploy is genuinely intended.

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: testnet          # requires manual approval in repo settings
    permissions:
      contents: write             # needed to push deployment manifest back to repo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run contract tests (pre-flight)
        run: npm run test:contracts
        env:
          HARDHAT_NETWORK: hardhat

      - name: Deploy to Arbitrum Sepolia (full)
        if: github.event.inputs.handle_only != 'true' && github.event.inputs.escrow_only != 'true' && github.event.inputs.tournament_only != 'true'
        run: npm run deploy:testnet
        env:
          DEPLOYER_KEY:       ${{ secrets.DEPLOYER_KEY }}
          ARB_SEPOLIA_RPC:    ${{ secrets.ARB_SEPOLIA_RPC }}
          ARBISCAN_API_KEY:   ${{ secrets.ARBISCAN_API_KEY }}
          OPERATOR_SIGNER:    ${{ secrets.OPERATOR_SIGNER }}
          RAKE_WALLET:        ${{ secrets.RAKE_WALLET }}
          ANTIBOT_ORACLE:     ${{ secrets.ANTIBOT_ORACLE }}
          DEV_WALLET:         ${{ secrets.DEV_WALLET }}
          OPS_WALLET:         ${{ secrets.OPS_WALLET }}
          COMMUNITY_WALLET:   ${{ secrets.COMMUNITY_WALLET }}
          LIQUIDITY_WALLET:   ${{ secrets.LIQUIDITY_WALLET }}

      - name: Redeploy PokerEscrow only
        if: github.event.inputs.escrow_only == 'true'
        run: npm run deploy:escrow
        env:
          DEPLOYER_KEY:    ${{ secrets.DEPLOYER_KEY }}
          ARB_SEPOLIA_RPC: ${{ secrets.ARB_SEPOLIA_RPC }}
          OPERATOR_SIGNER: ${{ secrets.OPERATOR_SIGNER }}
          RAKE_WALLET:     ${{ secrets.RAKE_WALLET }}
          ANTIBOT_ORACLE:  ${{ secrets.ANTIBOT_ORACLE }}

      - name: Redeploy TournamentManager only
        if: github.event.inputs.tournament_only == 'true'
        run: npm run deploy:tournament
        env:
          DEPLOYER_KEY:    ${{ secrets.DEPLOYER_KEY }}
          ARB_SEPOLIA_RPC: ${{ secrets.ARB_SEPOLIA_RPC }}
          OPERATOR_SIGNER: ${{ secrets.OPERATOR_SIGNER }}
          RAKE_WALLET:     ${{ secrets.RAKE_WALLET }}

      - name: Deploy PokerHandle only
        if: github.event.inputs.handle_only == 'true'
        run: npm run deploy:handle
        env:
          DEPLOYER_KEY:    ${{ secrets.DEPLOYER_KEY }}
          ARB_SEPOLIA_RPC: ${{ secrets.ARB_SEPOLIA_RPC }}

      - name: Re-encrypt .env and commit deployment manifest
        env:
          ENV_PASSPHRASE: ${{ secrets.ENV_PASSPHRASE }}
        run: |
          node scripts/setupEnv.js || echo "⚠️ setupEnv.js warnings (non-fatal in CI)"
          if [ -n "$ENV_PASSPHRASE" ]; then
            # encryptEnv.js refuses if .env holds a populated secret — .env.enc is
            # committed, and committed ciphertext cannot be un-published. It also
            # keeps the passphrase off the command line and raises PBKDF2 iterations.
            node scripts/encryptEnv.js
            git add .env.enc
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deployments/arbitrumSepolia.json
          git diff --cached --quiet || git commit -m "chore: update deployment manifest + .env.enc [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Fund deployer from faucet
        if: github.event.inputs.run_faucet == 'true'
        run: npm run faucet
        env:
          DEPLOYER_KEY:    ${{ secrets.DEPLOYER_KEY }}
          ARB_SEPOLIA_RPC: ${{ secrets.ARB_SEPOLIA_RPC }}

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-arbitrumSepolia
          path: deployments/arbitrumSepolia.json
          retention-days: 90
