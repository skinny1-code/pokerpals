name: Deploy WS Server to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'fly.toml'
      - 'package*.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Check token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN is empty — secret not set correctly"
            exit 1
          fi
          echo "Token is set (${#FLY_API_TOKEN} chars)"

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
