name: Deploy Game Server to Fly.io

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deployments/**'
      - 'Dockerfile'
      - 'fly.toml'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create Fly.io app if needed
        run: flyctl apps create pokerpals --org personal 2>/dev/null || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Stage secrets
        run: |
          flyctl secrets set \
            OPERATOR_PRIVATE_KEY="${{ secrets.OPERATOR_PRIVATE_KEY }}" \
            TESTNET_SKIP_HUMAN_CHECK=true \
            ARB_SEPOLIA_RPC="https://sepolia-rollup.arbitrum.io/rpc" \
            --stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        run: flyctl deploy --remote-only --wait-timeout 180
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
