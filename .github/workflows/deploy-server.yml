# Fly.io deploy disabled — using Koyeb instead (see koyeb.com dashboard)
# To re-enable, restore the 'on:' trigger below.

name: Deploy Game Server to Fly.io

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to deploy to Fly.io'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.confirm == 'YES' }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Create Fly.io app if needed
        run: flyctl apps create pokerpals --org personal 2>/dev/null || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Stage secrets
        run: |
          flyctl secrets set \
            OPERATOR_PRIVATE_KEY="${{ secrets.OPERATOR_PRIVATE_KEY }}" \
            TESTNET_SKIP_HUMAN_CHECK=true \
            ARB_SEPOLIA_RPC="https://sepolia-rollup.arbitrum.io/rpc" \
            --stage
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Deploy
        run: flyctl deploy --remote-only --wait-timeout 180
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
