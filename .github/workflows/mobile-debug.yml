name: Mobile Android debug build

on:
  push:
    branches: [feature/mobile-android-ios-shell]
    paths: ['mobile/**', '.github/workflows/mobile-debug.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-debug.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund
      - name: Generate Android project
        working-directory: mobile
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: bash ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK for device tests
        uses: actions/upload-artifact@v4
        with:
          name: pokerpals-android-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
