name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Detect which layers actually changed ───────────────────────────────────
  changes:
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      server:    ${{ steps.filter.outputs.server }}
      frontend:  ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        run: |
          BASE=${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || 'HEAD~1' }}
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null || git diff --name-only HEAD~1 HEAD)

          contracts=false
          server=false
          frontend=false

          echo "$CHANGED" | grep -qE '^(contracts/|test/(contracts/)?PokerEscrow|hardhat\.config|scripts/deploy)' && contracts=true
          echo "$CHANGED" | grep -qE '^(server/|test/holdem)'                                          && server=true
          echo "$CHANGED" | grep -qE '^(src/|public/|next\.config|package\.json)'                     && frontend=true

          # Always run everything on the default branch push
          if [[ "${{ github.ref }}" == "refs/heads/main" || "${{ github.ref }}" == "refs/heads/master" ]]; then
            contracts=true; server=true; frontend=true
          fi

          echo "contracts=$contracts" >> "$GITHUB_OUTPUT"
          echo "server=$server"       >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend"   >> "$GITHUB_OUTPUT"

          echo "### Changed layers" >> "$GITHUB_STEP_SUMMARY"
          echo "- contracts: $contracts" >> "$GITHUB_STEP_SUMMARY"
          echo "- server:    $server"    >> "$GITHUB_STEP_SUMMARY"
          echo "- frontend:  $frontend"  >> "$GITHUB_STEP_SUMMARY"

  # ── Smart-contract compile + test ─────────────────────────────────────────
  contracts:
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run contract tests
        run: npm run test:contracts
        env:
          HARDHAT_NETWORK: hardhat

  # ── Game-logic (hold'em) unit tests ───────────────────────────────────────
  game-logic:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run hold'em logic tests
        run: npm test

  # ── Next.js build ─────────────────────────────────────────────────────────
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          # Stub public vars so the build doesn't fail without a real .env
          NEXT_PUBLIC_CHAIN_ID: "421614"
          NEXT_PUBLIC_WS_URL: "ws://localhost:8080"
          NEXT_PUBLIC_WC_PROJECT_ID: "ci-stub"
          NEXT_PUBLIC_CHIPS_TOKEN: "0x0000000000000000000000000000000000000001"
          NEXT_PUBLIC_ESCROW: "0x0000000000000000000000000000000000000002"
          NEXT_PUBLIC_STAKING: "0x0000000000000000000000000000000000000003"
          NEXT_PUBLIC_REFERRAL: "0x0000000000000000000000000000000000000004"
          NEXT_PUBLIC_TOURNAMENT: "0x0000000000000000000000000000000000000005"
          NEXT_PUBLIC_TABLE_REGISTRY: "0x0000000000000000000000000000000000000006"
          NEXT_PUBLIC_POKER_HANDLE: "0x0000000000000000000000000000000000000007"

  # ── Gate: all required jobs passed ────────────────────────────────────────
  # Branch-protection rule should require this single job rather than the
  # individual dynamic ones (which may be skipped).
  all-checks:
    needs: [contracts, game-logic, frontend]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all active jobs succeeded
        run: |
          results='${{ toJSON(needs) }}'
          echo "Job results: $results"
          failed=$(echo "$results" | python3 -c "
import json,sys
data=json.load(sys.stdin)
failures=[k for k,v in data.items() if isinstance(v,dict) and v.get('result')=='failure']
print(len(failures))
if failures: print('FAILED:', ','.join(failures), file=sys.stderr)
")
          if [ "$failed" -gt 0 ]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All active jobs passed (skipped jobs are OK)."
